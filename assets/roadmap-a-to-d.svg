<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="240" fill="#ffffff"/>
  <text x="340" y="34" fill="#1f2328" font-size="18" font-weight="700" text-anchor="middle">自优化演进路线图：A 自评审 → D 自适应</text>
  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5">
    <rect x="30" y="90" width="140" height="60" rx="8"/>
    <rect x="190" y="90" width="140" height="60" rx="8"/>
    <rect x="350" y="90" width="140" height="60" rx="8"/>
    <rect x="510" y="90" width="140" height="60" rx="8"/>
  </g>
  <g fill="#1f2328" font-size="13" text-anchor="middle">
    <text x="100" y="116">A 自评审</text>
    <text x="100" y="136">self-critique</text>
    <text x="260" y="116">B 双模型</text>
    <text x="260" y="136">裁判</text>
    <text x="420" y="116">C 独立裁判</text>
    <text x="420" y="136">judge model</text>
    <text x="580" y="116">D 自适应</text>
    <text x="580" y="136">定向改法</text>
  </g>
  <g stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M170 120 L188 120"/>
    <path d="M330 120 L348 120"/>
    <path d="M490 120 L508 120"/>
  </g>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0969da"/></marker></defs>
  <text x="340" y="200" fill="#656d76" font-size="12" text-anchor="middle">自动化程度递增：从自评审到失败类型驱动的定向改法（自适应闭环）</text>
</svg>
