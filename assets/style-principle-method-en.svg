<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="680" height="560" fill="#f8fafc"/>

  <!-- defs: arrowhead -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="340" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Prompt Optimization: Style &amp; Principle Lifecycle</text>

  <!-- input box -->
  <rect x="200" y="64" width="280" height="64" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="340" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Raw prompt with issues</text>
  <text x="340" y="113" text-anchor="middle" font-size="11" fill="#075985">Vague words · No criteria · Role confusion</text>

  <!-- down arrow input -> core -->
  <line x1="340" y1="128" x2="340" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- core principle box -->
  <rect x="70" y="162" width="540" height="84" rx="12" fill="#0d9488"/>
  <text x="340" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Core principle: replace "subjective feeling" with "verifiable actions + standards"</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#ccfbf1">Replace ambiguity with constraints so the model has clear boundaries at every step</text>

  <!-- down arrow core -> pipeline label -->
  <line x1="340" y1="246" x2="340" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Four-step pipeline (diagnose → align → adapt → accept)</text>

  <!-- four step boxes -->
  <!-- step 1 -->
  <rect x="30" y="320" width="130" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="95" cy="348" r="15" fill="#0d9488"/>
  <text x="95" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="95" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Diagnose</text>
  <text x="95" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">find anti-patterns</text>

  <!-- step 2 -->
  <rect x="193" y="320" width="130" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="258" cy="348" r="15" fill="#0d9488"/>
  <text x="258" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="258" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Checklist</text>
  <text x="258" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">dimension check</text>

  <!-- step 3 -->
  <rect x="356" y="320" width="130" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="421" cy="348" r="15" fill="#0d9488"/>
  <text x="421" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="421" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Adapt</text>
  <text x="421" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">directed fixes</text>

  <!-- step 4 -->
  <rect x="519" y="320" width="130" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="584" cy="348" r="15" fill="#0d9488"/>
  <text x="584" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="584" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Regression</text>
  <text x="584" y="396" text-anchor="middle" font-size="10.5" fill="#64748b">expected vs actual</text>

  <!-- arrows between steps -->
  <line x1="162" y1="363" x2="190" y2="363" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="363" x2="353" y2="363" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="488" y1="363" x2="516" y2="363" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down arrow pipeline -> output -->
  <line x1="340" y1="406" x2="340" y2="436" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output box -->
  <rect x="150" y="440" width="380" height="66" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Reusable artifact (testable · portable · versionable)</text>
  <text x="340" y="489" text-anchor="middle" font-size="12" fill="#166534">Optimized · Adapted · Checklist · Comparison</text>

  <!-- footer note -->
  <text x="340" y="538" text-anchor="middle" font-size="10.5" fill="#94a3b8">Companion docs: README "Optimization style &amp; principle" / SOP.md / skill/references/</text>
</svg>
