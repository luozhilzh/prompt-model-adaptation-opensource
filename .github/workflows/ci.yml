name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --upgrade pip -r requirements.txt

      - name: Run regression + consistency tests
        run: python scripts/test_phase0.py

      - name: Run doc anti-drift gate (README tree + local links)
        run: python -m unittest scripts.test_phase0.Phase1AntiDriftTest -v

      - name: Run harness unit tests (run_loop.py logic, no API)
        run: python scripts/test_harness.py

      - name: Run Phase 2/3 offline scaffold tools (no API)
        run: |
          python scripts/eval_credibility.py --demo
          python scripts/root_cause.py --demo

      - name: Run §6 merge-candidates review (no API)
        run: python scripts/merge_candidates.py --demo

      - name: Run §6 apply-merge draft (no API)
        run: python scripts/apply_merge.py --demo
